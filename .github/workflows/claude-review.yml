name: Claude Review

# AI code review lewat 9router (self-hosted gateway di Railway) — BUKAN API key resmi.
# Base URL & token diinject ke Claude Code CLI via `settings.env`, persis kayak config lokal.
# Auto-review tiap PR dibuka / di-push. Bisa juga dipanggil manual lewat @claude di komentar.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches:
      - main
      - production
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    # Skip draft PR biar gak boros; @claude mention tetep jalan walau draft.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mint token dari GitHub App milik kita sendiri (bukan Claude App resmi).
      # Efeknya: comment ke-post sebagai <nama-app>[bot] + logo yang di-upload,
      # BUKAN github-actions[bot]. App ID & private key disimpen di repo secrets.
      #
      # continue-on-error: kalau App belum di-install ke repo (404) atau key salah,
      # step ini GAGAL tapi job TETAP lanjut — github_token di bawah fallback ke
      # GITHUB_TOKEN, jadi review selalu jalan (paling nama bot-nya github-actions).
      - name: Generate app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SW_APP_ID }}
          private-key: ${{ secrets.SW_APP_PRIVATE_KEY }}

      - name: Claude Review
        uses: anthropics/claude-code-action@v1
        # Base URL & token 9router ditaruh di STEP-LEVEL env — bukan di `settings`.
        # Alasannya: action punya validator kredensial yang cuma ngenalin ANTHROPIC_API_KEY,
        # dan validator itu baca dari env (bukan dari settings.env yang cuma buat subprocess).
        # 9router nerima key via header x-api-key (ANTHROPIC_API_KEY) — sesuai setup resminya.
        env:
          ANTHROPIC_BASE_URL: https://sw-9router.up.railway.app/v1
          ANTHROPIC_API_KEY: ${{ secrets.NINEROUTER_TOKEN }}
        with:
          # Token dari GitHub App kita (step app-token di atas). Skip OIDC exchange,
          # dan comment ke-post sebagai <nama-app>[bot] + logo custom — bukan
          # github-actions[bot]. Fallback ke GITHUB_TOKEN kalau app-token gagal.
          github_token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # KUNCI: paksa tag mode + tracking comment. Tanpa ini, di agent mode
          # teks final Claude GAK ke-post ke mana-mana (makanya review ilang terus).
          # Dengan track_progress, action auto-bikin 1 comment dan Claude nulis
          # review ke situ via mcp__github_comment__update_claude_comment.
          track_progress: true
          # Model WAJIB prefix cc/ — itu format yang dikenal 9router.
          prompt: |
            ${{ (github.event_name == 'pull_request') && format('Review Pull Request #{0} di repo {1}. PR branch udah ke-checkout di working directory.

            RUANG LINGKUP — WAJIB DIPATUHI:
            - Review HANYA baris yang BERUBAH di PR ini. Jangan review kode lama yang tidak disentuh PR ini.
            - Kalau nemu masalah di kode LAMA (di luar diff), abaikan — kecuali perubahan di PR ini secara langsung bikin kode lama itu jadi bug (regresi).
            - Baca file di sekitar diff SECUKUPNYA cuma buat paham konteks. Tujuannya paham dampak perubahan, BUKAN audit seluruh codebase.

            LANGKAH:
            0. WAJIB baca dulu (pakai Read): `REVIEW.md` (aturan format & severity) dan `AGENTS.md` (aturan project). Ini sumber kebenaran review — jangan review tanpa baca dua file ini.
            1. Jalankan `gh pr diff {0}` buat lihat perubahan persisnya.
            2. Untuk tiap file yang berubah, baca file itu + file sekitarnya (pakai Read/Grep/Glob) SECUKUPNYA buat paham konteks. Cek: correctness bug, security hole, edge case kelewat, regresi, dan pelanggaran aturan AGENTS.md (rate-limit, transaction array-form, requirePermission, Zod, logAudit, no-hardcode-color, dll).
            3. Post tiap temuan pakai `mcp__github_inline_comment__create_inline_comment` (confirmed: true) tepat di baris yang berubah, PERSIS format ini:

               🔴 **Important** — <ringkasan 1 kalimat>

               <1-2 kalimat: dampak konkret + fix.>

               <details><summary>Reasoning</summary>

               <kenapa masalah, verifikasi `file:line`, aturan AGENTS.md yg dilanggar.>
               </details>

               Marker severity: 🔴 Important (bug/security/pelanggaran keras) / 🟡 Nit (minor, maks 5) / 🟣 Pre-existing (bug kode lama, jangan diaudit). Kutip `file:line` — jangan nebak dari nama.
            4. WAJIB tutup dengan summary — tulis ke tracking comment pakai `mcp__github_comment__update_claude_comment`. Ini LANGKAH TERAKHIR YANG WAJIB, bahkan kalau gak ada isu sama sekali. Baris pertama tally: `Review — <N> Important, <N> Nit` (atau `✅ No blocking issues` kalau bersih), lalu tabel `| Sev | Lokasi | Isu |` urut severity (🔴 dulu). Jangan ulang reasoning — udah di inline.

            PENTING:
            - Summary WAJIB ditulis via `mcp__github_comment__update_claude_comment` (tracking comment udah disiapin action). Inline finding via `mcp__github_inline_comment__create_inline_comment`.
            - JANGAN cuma output teks biasa sebagai hasil akhir — teks yang gak ditulis ke tracking comment / inline comment akan ILANG.

            JANGAN:
            - Komentarin style/format yang udah dihandle ESLint/Prettier.
            - Komentarin file yang gak berubah di PR ini.
            - Nyaranin refactor besar di luar scope PR.', github.event.pull_request.number, github.repository) || '' }}
          claude_args: |
            --max-turns 30
            --model cc/claude-opus-4-8
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
