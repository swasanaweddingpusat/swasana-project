name: CD — Production

on:
  push:
    branches:
      - live

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate DB
    runs-on: ubuntu-latest
    env:
      # Pooled URL for runtime/fallback; DIRECT_URL (non-pooled) is what
      # prisma.config.ts prefers for `migrate deploy` to avoid PgBouncer
      # advisory-lock contention on Neon. Both must point at the SAME Neon
      # project as the Vercel env used by the deploy job.
      DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
      DIRECT_URL: ${{ secrets.DIRECT_URL_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

  build-and-deploy:
    name: Build & Deploy
    needs: migrate
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Pull project settings + env vars from Vercel. Single source of truth
      # for DATABASE_URL at build/runtime — keep in sync with the migrate job.
      - name: Pull Vercel environment
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Build ONCE, here, using the pulled env. No separate `npm run build`.
      - name: Build with Vercel
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      # Deploy the prebuilt output — what ships is exactly what we just built.
      - name: Deploy prebuilt to Vercel
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
